<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kiberskaz — лучшие песни. Слушайте и скачивайте бесплатно.">
<title>Kiberskaz — песни бесплатно</title>
<style>
/* ===== НАСТРОЙКА ФОНОВОЙ КАРТИНКИ =====
   Вариант 1: положите изображение в папку covers и укажите путь ниже.
   Пример: background-image: linear-gradient(#080b14bb,#080b14dd), url("covers/background.jpg");
   Вариант 2: используйте прямую ссылку на изображение из интернета.
*/
:root {
  --page-background: url("covers/background.png"); /* <-- ПУТЬ К ФОНОВОЙ КАРТИНКЕ */
  --page-overlay: linear-gradient(120deg, rgba(5,8,18,.91), rgba(8,11,24,.82));
  --accent: #70e5ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background-color:#090d18;
  background-image:var(--page-overlay), var(--page-background); /* <-- ФОН ПОДКЛЮЧАЕТСЯ ЗДЕСЬ */
  background-position:center top;
  background-size:cover;
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:#f5f7ff;
  font-family:Arial,sans-serif;
  line-height:1.6
}
header,main,footer{max-width:1100px;margin:auto;padding:22px}
header{border-bottom:1px solid #ffffff24;font-size:24px;font-weight:bold;letter-spacing:1px}
header span{color:var(--accent)}
.hero{padding-top:60px;padding-bottom:40px}
.hero small{color:var(--accent);letter-spacing:3px;font-weight:bold}
.hero h1{font-size:clamp(38px,8vw,68px);line-height:1.05;margin:15px 0}
.hero p,.muted{color:#c0c9dc}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
input{width:100%;padding:14px;border:1px solid #303a53;border-radius:10px;background:#12192ae8;color:white;font-size:16px;margin:10px 0 20px}
.song{display:flex;gap:18px;align-items:flex-start;padding:18px;margin:14px 0;background:#101729eF;border:1px solid #ffffff25;border-radius:16px;backdrop-filter:blur(8px)}
.song-content{flex:1;min-width:0;width:100%}
.player{width:100%;margin:14px 0 12px;padding:14px 16px;border:1px solid #ffffff20;border-radius:13px;background:#080e1c}
.player-top{display:flex;align-items:center;gap:14px}
.play-button{flex:0 0 46px;width:46px;height:46px;border:0;border-radius:50%;background:var(--accent);color:#07101a;font-size:19px;font-weight:bold;cursor:pointer}
.timeline{flex:1;min-width:0}
.seek{display:block;width:100%;height:8px;margin:0;accent-color:var(--accent);cursor:pointer}
.time-row{display:flex;justify-content:space-between;gap:10px;margin-top:5px;color:#b8c4da;font-size:12px;font-variant-numeric:tabular-nums}
.player-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;color:#aab7d0;font-size:12px}
.player-status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.btn{display:inline-block;text-decoration:none;background:var(--accent);color:#07101a;font-weight:bold;padding:9px 13px;border-radius:8px}
.cover{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#202a42;flex-shrink:0}
.song h3{margin:0 0 4px;font-size:19px}.song p{margin:0 0 10px;color:#c0c9dc;font-size:14px}
.empty{color:#c0c9dc}
footer{border-top:1px solid #ffffff24;color:#aab5ca;font-size:13px;margin-top:40px}
@media(max-width:500px){header,main,footer{padding:17px}.hero{padding-top:42px}.song{align-items:flex-start;gap:12px}.cover{width:72px;height:72px}}
</style>
</head>
<body>
<header>Kiberskaz</header>
<main>
<section class="hero">
<small>OPEN MUSIC ARCHIVE</small>
<h1>Песни, которые<br>остаются с тобой.</h1>
<p>Авторские песни проекта Kiberskaz. Слушайте и скачивайте бесплатно.</p>
</section>
<section>
<div class="section-title"><h2>Архив песен</h2><span id="total" class="muted"></span></div>
<input id="search" type="search" placeholder="Найти песню по названию…">
<div id="songs"></div><p id="empty" class="empty" hidden>Песен по такому запросу не найдено.</p>
</section>
</main>
<footer>© <span id="year"></span> Kiberskaz · Бесплатный архив авторских песен</footer>
<script src="songs.js"></script>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const root=document.getElementById('songs'),search=document.getElementById('search');
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(seconds){if(!Number.isFinite(seconds)||seconds<0)return '0:00';const m=Math.floor(seconds/60),s=Math.floor(seconds%60);return m+':'+String(s).padStart(2,'0')}
function draw(){
  const q=search.value.trim().toLocaleLowerCase('ru');
  const list=SONGS.filter(s=>(s.title+' '+(s.description||'')).toLocaleLowerCase('ru').includes(q));
  document.getElementById('total').textContent=SONGS.length+' песен';
  root.innerHTML=list.map((s,i)=>'<article class="song"><img class="cover" src="'+esc(s.cover||'covers/default.svg')+'" alt="Обложка песни"><div class="song-content"><h3>'+esc(s.title)+'</h3><p>'+esc(s.description||'Авторская песня Kiberskaz')+'</p>'+
    (s.url?'<div class="player" data-player="'+i+'"><audio preload="none" src="'+esc(s.url)+'"></audio><div class="player-top"><button class="play-button" type="button" aria-label="Слушать '+esc(s.title)+'" title="Воспроизвести">▶</button><div class="timeline"><input class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка песни"><div class="time-row"><span class="current-time">0:00</span><span class="duration">--:--</span></div></div></div><div class="player-bottom"><span class="player-status">Готово к воспроизведению</span><span>MP3</span></div></div><div class="song-actions"><a class="btn" href="'+esc(s.url)+'" download>Скачать MP3 бесплатно</a></div>':'<span class="muted">Добавьте путь к MP3 в songs.js</span>')+'</div></article>').join('');
  document.getElementById('empty').hidden=list.length>0;
  root.querySelectorAll('.player').forEach(player=>{
    const audio=player.querySelector('audio'),play=player.querySelector('.play-button'),seek=player.querySelector('.seek'),current=player.querySelector('.current-time'),duration=player.querySelector('.duration'),status=player.querySelector('.player-status');
    audio.addEventListener('loadedmetadata',()=>{duration.textContent=fmt(audio.duration);status.textContent='Можно слушать и перематывать'});
    audio.addEventListener('timeupdate',()=>{current.textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)seek.value=String(Math.round(audio.currentTime/audio.duration*1000))});
    audio.addEventListener('play',()=>{play.textContent='Ⅱ';play.title='Пауза';play.setAttribute('aria-label','Пауза')});
    audio.addEventListener('pause',()=>{play.textContent='▶';play.title='Воспроизвести';play.setAttribute('aria-label','Воспроизвести')});
    audio.addEventListener('ended',()=>{status.textContent='Песня закончилась'});
    audio.addEventListener('error',()=>{status.textContent='Не удалось загрузить MP3 — проверьте путь к файлу'});
    play.addEventListener('click',()=>{if(audio.paused){root.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()});audio.play().catch(()=>{status.textContent='Не удалось запустить MP3 — проверьте файл и ссылку'})}else audio.pause()});
    seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0){audio.currentTime=(Number(seek.value)/1000)*audio.duration;current.textContent=fmt(audio.currentTime)}});
  });
}
search.addEventListener('input',draw);draw();
</script>
</body>
</html>
